name: CitizenshipTest
options:
  bundleIdPrefix: com.citizenready
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CitizenshipTest:
    type: application
    platform: iOS
    sources:
      - path: CitizenshipTest
        excludes:
          - "Resources/Preview Content"
          - "Resources/*.json"
    resources:
      - path: CitizenshipTest/Resources/Assets.xcassets
      - path: CitizenshipTest/Resources/Preview Content
      - path: CitizenshipTest/Resources/legislators-current.json
      - path: CitizenshipTest/Resources/executive.json
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to determine your congressional district for practice questions"
        PRODUCT_BUNDLE_IDENTIFIER: com.badriram.citizenready
        PRODUCT_NAME: "US Civics Ready"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KY478X48U7
    scheme:
      testTargets:
        - CitizenshipTestUITests
    entitlements:
      path: CitizenshipTest/CitizenshipTest.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.com.badriram.citizenready"
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"

  CitizenshipTestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CitizenshipTestUITests
    dependencies:
      - target: CitizenshipTest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.badriram.citizenready.uitests
        TEST_TARGET_NAME: CitizenshipTest
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KY478X48U7
