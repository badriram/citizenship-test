name: Governors check

# data/governors.json is read live by the iOS app and the web study page.
# This only raises an issue; a person verifies and edits the file.
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare against Wikidata
        id: check
        run: |
          set +e
          python3 Tools/governors/check.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open or update issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Governor changes to review"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi

      - name: Fail on query error
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        run: exit 1
